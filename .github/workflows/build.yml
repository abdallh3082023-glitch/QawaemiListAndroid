name: Build Qawaemi List APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -50

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project/QawaemiListAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawaemi-List-APK
          path: project/QawaemiListAndroid/app/build/outputs/apk/debug/app-debug.apk
